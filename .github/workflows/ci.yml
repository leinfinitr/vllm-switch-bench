name: CI

on:
  push:
    branches: [master, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
          enable-cache: true
      - name: Install the locked development environment
        run: uv sync --frozen --group dev
      - name: Unit tests
        run: uv run pytest tests -q
      - name: Python lint and formatting
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Bash syntax
        run: scripts/check_bash.sh
      - name: Documentation and portability
        run: scripts/docs.sh
      - name: Result bundle semantics
        run: scripts/validate_all.sh
      - name: Deterministic artifact rebuild
        run: |
          scripts/build_all.sh
          git diff --exit-code -- results
      - name: Tracked ignored files
        run: scripts/tracked-ignore.sh
      - name: Git whitespace
        run: git diff --check HEAD^
