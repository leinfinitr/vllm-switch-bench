name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
          enable-cache: true
      - name: Install the locked source package and development tools
        run: uv sync --frozen --group dev
      - name: Unit tests
        run: uv run pytest tests -q
      - name: Python lint
        run: uv run ruff check src tests
      - name: Python formatting
        run: uv run ruff format --check src tests
      - name: Bash syntax
        run: scripts/check_bash.sh
      - name: Documentation policy and links
        run: scripts/docs.sh
      - name: Build current artifacts
        run: scripts/build_all.sh
      - name: Validate current artifact semantics
        run: scripts/validate_all.sh
      - name: Require a clean first rebuild
        run: git diff --exit-code -- results
      - name: Rebuild and validate a second time
        run: |
          scripts/build_all.sh
          scripts/validate_all.sh
          git diff --exit-code -- results
      - name: Require no tracked ignored files
        run: |
          scripts/tracked-ignore.sh
          test -z "$(git ls-files -ci --exclude-standard)"
      - name: Build wheel and source distribution
        run: uv build
      - name: Install wheel and smoke installed CLIs
        run: |
          uv venv --python 3.12 .venv-wheel
          uv pip install --python .venv-wheel/bin/python dist/*.whl
          .venv-wheel/bin/python -c 'import llm_switch_bench'
          for command in \
            llm-switch-build-all \
            llm-switch-validate-all \
            llm-switch-check-docs \
            llm-switch-lifecycle \
            llm-switch-vllm-profiling \
            llm-switch-request-driven-switch \
            llm-switch-backup-reuse-reclaim \
            llm-switch-exact-disk; do
            ".venv-wheel/bin/$command" --help >/dev/null
          done
      - name: Git whitespace
        run: git diff --check
