# Copy this file to configs/baseline3.local.yaml and replace every placeholder.
model: /path/to/model
prompts: [short_short, long_short, short_long]
repeats: 3
cuda_home: /path/to/cuda
systems:
  vllm:
    # Must contain summary.json produced for the same model/workload.
    result_dir: /path/to/vllm/result
  serverless_llm:
    repo: /path/to/ServerlessLLM
    host: 127.0.0.1
    port: 8343
    primary_method: delete_register
    optional_methods: [scale_to_zero_restore]
    registered_model_name: model-under-test
    # Explicit container path avoids guessing host mount layout.
    container_model_path: /container/path/to/model
  swapserve_llm:
    repo: /path/to/SwapServeLLM
    host: 127.0.0.1
    port: 8000
    backend: vllm
    api_key: dummy
    log_dir: /path/to/swapserve/logs
