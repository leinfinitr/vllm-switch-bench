healthCheckTimeout: 180
logLevel: info
logToStdout: both
startPort: 18200
sendLoadingState: false
unloadTimeout: 30
models:
  qwen-0.5b:
    cmd: >-
      /home/ljl/research-systems/llm-switch-bench/.venv/bin/python
      -m vllm.entrypoints.openai.api_server
      --model /home/ljl/models/hf/Qwen2.5-0.5B-Instruct
      --served-model-name qwen-0.5b
      --host 127.0.0.1 --port ${PORT}
      --max-model-len 1024 --gpu-memory-utilization 0.70
      --dtype half --enforce-eager
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    env:
      - PYTHONPATH=/home/ljl/research-systems/vllm
      - CUDA_HOME=/home/ljl/cuda-13.0
      - PATH=/home/ljl/cuda-13.0/bin:/home/ljl/research-systems/llm-switch-bench/.venv/bin:/usr/local/bin:/usr/bin:/bin
  qwen-1.5b:
