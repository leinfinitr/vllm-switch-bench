models:
  qwen-1.5b:
    backend_url: http://127.0.0.1:8101
    served_model_name: qwen-1.5b
    sleep_level: 1
    wake_tags: null
    cwd: /home/ljl/research-systems/vllm
    env:
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_SLEEP_PROFILE_PATH: /home/ljl/research-systems/vllm-model-switch-controller/results/osdi_20260723/qwen-1.5b.sleep.jsonl
      VLLM_USE_FLASHINFER_SAMPLER: "0"
    launch_command:
      - /home/ljl/research-systems/llm-switch-bench/.venv/bin/vllm
      - serve
      - /home/ljl/models/hf/Qwen2.5-1.5B-Instruct
      - --host
      - 127.0.0.1
      - --port
      - "8101"
      - --served-model-name
      - qwen-1.5b
      - --enable-sleep-mode
      - --enable-request-id-headers
      - --gpu-memory-utilization
      - "0.70"
      - --max-model-len
      - "1024"
      - --enforce-eager
      - --dtype
      - half
  qwen-3b:
    backend_url: http://127.0.0.1:8102
    served_model_name: qwen-3b
    sleep_level: 1
    wake_tags: null
    cwd: /home/ljl/research-systems/vllm
    env:
      VLLM_SERVER_DEV_MODE: "1"
      VLLM_SLEEP_PROFILE_PATH: /home/ljl/research-systems/vllm-model-switch-controller/results/osdi_20260723/qwen-3b.sleep.jsonl
      VLLM_USE_FLASHINFER_SAMPLER: "0"
    launch_command:
      - /home/ljl/research-systems/llm-switch-bench/.venv/bin/vllm
      - serve
      - /home/ljl/models/hf/Qwen2.5-3B-Instruct
      - --host
      - 127.0.0.1
      - --port
      - "8102"
      - --served-model-name
      - qwen-3b
      - --enable-sleep-mode
      - --enable-request-id-headers
      - --gpu-memory-utilization
      - "0.70"
      - --max-model-len
      - "1024"
      - --enforce-eager
      - --dtype
      - half
controller:
  host: 127.0.0.1
  port: 9000
  policy: always_sleep_previous
  startup_awake_model: qwen-1.5b
  request_timeout_s: 600
  switch_timeout_s: 600
  metrics_path: results/osdi_20260723/controller-events.jsonl
  cpu_memory_reclaim_available_ratio: 0.05
  cpu_memory_recovery_available_ratio: 0.10
  cpu_memory_poll_interval_s: 1.0
  cpu_memory_pressure_consecutive_samples: 3
  cpu_memory_reclaim_cooldown_s: 5.0
